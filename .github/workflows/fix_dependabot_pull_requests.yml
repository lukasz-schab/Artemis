name: Compile requirements

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    container:
      image: python:3.13-alpine3.20
    permissions:
      contents: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - run: apk add bash git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.head_ref }}

      - run: pip install pip-tools --break-system-packages
      - run: ./scripts/compile-requirements
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add requirements.txt docs/requirements.txt
          git diff --cached --quiet || git commit -m "Recompile requirements"
          git push
